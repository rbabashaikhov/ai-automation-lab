[project]
name = "n8n-tool-automation"
version = "0.1.0"
description = "Read-only CLI tooling for exporting n8n workflows via the public REST API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["n8n_tool"]
